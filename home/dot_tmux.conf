# ~/.tmux.conf

# --- Keybindings, carried over unchanged from the original dotfiles ----------

# C-b sucks, make it C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Navigate windows
bind-key -n F11 previous-window
bind-key -n F12 next-window
bind-key -n M-[ select-pane -t :.-
bind-key -n M-] select-pane -t :.+

# Quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# Copy mode
bind Escape copy-mode

# Start window numbering at 1
set -g base-index 1
set-window-option -g pane-base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# hjkl pane traversal and alt arrow
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window splitting
bind-key s split-window -h
bind-key v split-window

# Choose session
bind-key -n M-0 choose-session

# Pane resizing - hold ALT + arrows
bind-key -nr M-Up resize-pane -U
bind-key -nr M-Down resize-pane -D
bind-key -nr M-Left resize-pane -L
bind-key -nr M-Right resize-pane -R

# Reload config
bind R source-file ~/.tmux.conf

# lazygit in a popup, in the current pane's directory
bind-key g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit

# vi keys in copy mode
set-window-option -g mode-keys vi

# --- Additions ---------------------------------------------------------------

# F1 / F2 switch to the previous / next window, like F11 / F12 above. tmux
# takes these before Neovim, so inside tmux use tj / tk for Neovim tabs.
bind-key -n F1 previous-window
bind-key -n F2 next-window

# Select and copy like vim in copy mode (tmux-yank sends y to the clipboard).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# C-a C opens Claude Code in a pane to the right, in the current directory.
bind-key C split-window -h -l 40% -c "#{pane_current_path}" claude

# C-a [ / C-a ] select the previous / next pane. These replace tmux's default
# copy-mode and paste-buffer keys; copy mode is still on C-a Escape.
bind-key [ select-pane -t :.-
bind-key ] select-pane -t :.+

# --- Terminal ----------------------------------------------------------------

# macOS's system terminfo has no tmux-256color, which breaks some programs
# there; fall back to screen-256color when it's missing.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",*:RGB"
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g renumber-windows on
set -g display-time 2000

# Clipboard over OSC 52 (works over SSH), and pass through escape sequences
# so images and notifications from tools like Claude Code reach the terminal.
set -s set-clipboard on
set -g allow-passthrough on

# Extended keys so Shift+Enter, Ctrl+Enter and friends reach apps (Claude Code
# uses Shift+Enter for a newline).
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# --- Windows and titles ------------------------------------------------------

set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g set-titles-string '[#I] #W'

# --- Status bar (same look as before, in tmux 3 style syntax) ----------------

set-option -g status-style "bg=#14161a,fg=colour248"
set-option -g status-left ''
set-option -g status-interval 60
set-option -g status-right '#[fg=colour226]⚡ #[fg=colour248]#(~/.local/bin/tmux-claude-usage) 🖥  #[fg=colour248]#(whoami)#[fg=colour226] (#H) #[fg=colour226]📅  #[fg=colour248]%-m/%-d/%Y #[fg=colour226]🕐 #[fg=colour248] #[bold]%-I:%M'
set-option -g status-right-length 120
set-option -g status-left-length 60

set-window-option -g window-status-style "bold"
set-window-option -g window-status-format ' #I #W '
set-window-option -g window-status-current-style "bg=colour0,fg=colour15,bold"
set-window-option -g window-status-current-format ' #I #W '

# --- Plugins (TPM, installed by chezmoi) -------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Sessions are saved every 15 minutes; restore them with prefix C-r. Automatic
# restore is off because it fights `ide`, which creates its own sessions.
set -g @resurrect-strategy-nvim 'session'

# Machine-only overrides, not in the repo.
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'

run -b '~/.tmux/plugins/tpm/tpm'
